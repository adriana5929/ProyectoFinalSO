services:
  web:
    build: .
    container_name: stress-web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:stresspass@db:5432/stress_db
    depends_on:
      - db
    networks:
      - stressnet

  db:
    image: postgres:15-alpine
    container_name: stress-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stresspass
      POSTGRES_DB: stress_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stressnet

networks:
  stressnet:
    driver: bridge
